[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "userintent-project"
version = "0.1.0"
description = "Etapa 1: extração e avaliação de intenção para um assistente de compras"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
