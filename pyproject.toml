[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buscai"
version = "0.2.0"
description = "Backend B2B de busca semântica e recomendação de produtos para o BuscaAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.28,<1",
    "langgraph>=1.2,<2",
    "numpy>=2,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]
semantic = [
    "sentence-transformers>=3,<6",
]
semantic-onnx = [
    "fastembed>=0.5,<1",
]
ui = [
    "streamlit>=1.40,<1.67",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["buscai*", "userintent*"]

[tool.setuptools.package-data]
buscai = ["catalog_profiles.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "ebay_live: testes opt-in que chamam a API real de produção da eBay (consomem cota)",
    "gemini_live: testes opt-in que chamam a API real do Google Gemini (consomem cota)",
    "semantic_real: testes de integração com o modelo real intfloat/multilingual-e5-small (sem chamadas Gemini/eBay)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["src/buscai/app"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = "^src/buscai/app/"

[tool.coverage.run]
source = ["src/buscai", "src/userintent"]
omit = ["src/buscai/app/*"]
